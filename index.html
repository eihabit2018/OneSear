<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <!-- 背景设置按钮 -->
    <button
      id="bg-settings-btn"
      class="bg-settings-btn"
      type="button"
      title="背景设置"
      aria-label="背景设置"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
    </button>

    <!-- 背景设置菜单 -->
    <div id="bg-menu" class="bg-menu" hidden>
      <button id="bg-upload-btn" class="bg-menu-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        选择背景图片
      </button>
      <button id="bg-reset-btn" class="bg-menu-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
        恢复默认背景
      </button>
    </div>
    <input id="bg-file-input" type="file" accept="image/*" hidden />

    <main class="page">
      <div class="hero">
        <p class="eyebrow">One Search</p>
        <h1>你想要什么？</h1>
        <div class="subtitle-ticker" aria-live="polite">
          <p id="subtitle-line" class="subtitle-line"></p>
        </div>

        <form id="search-form" class="search-form" autocomplete="off">
          <div class="search-shell">
            <div class="search-box">
              <div id="pinned-engines" class="pinned-engines"></div>
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="M20 20l-3.5-3.5" />
              </svg>
              <input
                id="search-input"
                type="search"
                name="q"
                placeholder="在你想去的平台搜索…  @平台名"
                autofocus
                enterkeyhint="search"
              />
              <button type="submit" aria-label="搜索">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </button>
            </div>
            <div id="mention-menu" class="mention-menu" hidden role="listbox"></div>
          </div>
        </form>

        <div id="result" class="result" hidden>
          <div class="result-main">
            <span id="result-badge" class="result-badge"></span>
            <p id="result-text" class="result-text"></p>
          </div>
          <div id="alternatives" class="alternatives"></div>
        </div>

        <div class="toolbar">
          <div class="hint-ticker" aria-live="polite">
            <p id="hint-line" class="hint-line"></p>
          </div>
          <button
            id="explore-toggle"
            type="button"
            class="history-toggle"
            aria-expanded="false"
            aria-controls="explore-panel"
          >
            随便看看
          </button>
          <button
            id="history-toggle"
            type="button"
            class="history-toggle"
            aria-expanded="false"
            aria-controls="history-panel"
          >
            我查看过
          </button>
        </div>

        <div id="history-panel" class="history-panel" hidden>
          <div class="history-header">
            <h2>我查看过</h2>
            <div class="history-header-actions">
              <button
                id="history-layout-toggle"
                type="button"
                class="history-layout-toggle"
                hidden
                title="切换列表显示方式"
                aria-label="切换列表显示方式"
              >
                紧凑
              </button>
              <button id="history-clear" type="button" class="history-clear" hidden>
                清空全部
              </button>
            </div>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>

        <div id="explore-panel" class="explore-panel" hidden>
          <div class="explore-header">
            <h2 class="explore-title">网址导航</h2>
            <div class="explore-header-actions">
              <button id="explore-cancel-btn" type="button" class="explore-action-btn" hidden>取消</button>
              <button id="explore-edit-btn" type="button" class="explore-action-btn">编辑</button>
              <button id="explore-restore-btn" type="button" class="explore-restore-btn" hidden>恢复默认</button>
            </div>
          </div>
          <div id="explore-modules"></div>

          <div id="explore-add-overlay" class="explore-add-overlay" hidden>
            <div class="explore-add-dialog">
              <h3>添加网址</h3>
              <label>名称
                <input id="explore-add-name" type="text" placeholder="网站名称" autocomplete="off">
              </label>
              <label>网址
                <input id="explore-add-url" type="url" placeholder="https://..." autocomplete="off">
              </label>
              <p id="explore-add-error" class="explore-add-error" hidden></p>
              <div class="explore-add-actions">
                <button id="explore-add-cancel-btn" type="button" class="explore-action-btn">取消</button>
                <button id="explore-add-confirm-btn" type="button" class="explore-action-btn explore-save-btn">确认</button>
              </div>
            </div>
          </div>

          <div id="explore-confirm-overlay" class="explore-add-overlay" hidden>
            <div class="explore-add-dialog">
              <h3>确认</h3>
              <p id="explore-confirm-msg" class="explore-confirm-msg"></p>
              <div class="explore-add-actions">
                <button id="explore-confirm-cancel-btn" type="button" class="explore-action-btn">取消</button>
                <button id="explore-confirm-ok-btn" type="button" class="explore-action-btn explore-save-btn">确认</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
